# patch-it status page · https://status.patch-it.dev
# Docs: https://upptime.js.org/docs/configuration
# Handbook: developer-handbook/runbooks/status-page.md
owner: patch-it-dev
repo: patch-it-uptime

# Who gets assigned when a site goes down (a GitHub issue is opened automatically)
assignees:
  - adssib

# Only list services that are LIVE. A service that isn't deployed yet
# opens a downtime issue immediately. Uncomment each one when it goes live.
sites:
  - name: Website
    url: https://patch-it.dev
    slug: website
    expectedStatusCodes:
      - 200
    maxResponseTime: 3000
  # - name: Docs
  #   url: https://docs.patch-it.dev
  #   slug: docs
  #   expectedStatusCodes:
  #     - 200
  #   maxResponseTime: 3000
  # - name: Change feed API
  #   url: https://api.patch-it.dev/v1/health
  #   slug: api
  #   expectedStatusCodes:
  #     - 200
  #   maxResponseTime: 2000
  # - name: App
  #   url: https://app.patch-it.dev
  #   slug: app
  #   expectedStatusCodes:
  #     - 200
  #   maxResponseTime: 3000

status-website:
  cname: status.patch-it.dev
  name: patch-it status
  logoUrl: https://raw.githubusercontent.com/patch-it-dev/patch-it-uptime/master/assets/patch-it-logo.svg
  favicon: https://raw.githubusercontent.com/patch-it-dev/patch-it-uptime/master/assets/patch-it-logo.svg
  faviconSvg: https://raw.githubusercontent.com/patch-it-dev/patch-it-uptime/master/assets/patch-it-logo.svg
  theme: dark
  introTitle: "**patch-it** system status"
  introMessage: Live status of the patch-it website, docs and change feed API. Checked every 5 minutes from GitHub, independently of our own infrastructure. Incidents are tracked as [GitHub issues](https://github.com/patch-it-dev/patch-it-uptime/issues).
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://patch-it.dev
    - title: Docs
      href: https://docs.patch-it.dev
    - title: GitHub
      href: https://github.com/patch-it-dev
  customHeadHtml: <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
  css: "body { font-family: 'IBM Plex Sans', system-ui, sans-serif; } h1, h2, h3, nav a { font-family: 'IBM Plex Mono', ui-monospace, monospace; } a { color: #ff8a57; }"
