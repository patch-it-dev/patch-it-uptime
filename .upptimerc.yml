# patch-it status page · https://status.patch-it.dev
# Docs: https://upptime.js.org/docs/configuration
# Handbook: developer-handbook/runbooks/status-page.md
owner: patch-it-dev
repo: patch-it-uptime

# Who gets assigned when a site goes down (a GitHub issue is opened automatically)
assignees:
  - adssib

# Only list services that are LIVE. A service that isn't deployed yet
# opens a downtime issue immediately. Uncomment each one when it goes live.
sites:
  - name: Website
    url: https://patch-it.dev
    slug: website
    expectedStatusCodes:
      - 200
    maxResponseTime: 3000
  - name: Docs
    url: https://docs.patch-it.dev
    slug: docs
    expectedStatusCodes:
      - 200
    maxResponseTime: 3000
  # - name: Change feed API
  #   url: https://api.patch-it.dev/v1/health
  #   slug: api
  #   expectedStatusCodes:
  #     - 200
  #   maxResponseTime: 2000
  # - name: App
  #   url: https://app.patch-it.dev
  #   slug: app
  #   expectedStatusCodes:
  #     - 200
  #   maxResponseTime: 3000

status-website:
  cname: status.patch-it.dev
  name: patch-it status
  # Brand: patch-it-brand (logo/, web/, design system tokens). Same look as patch-it.dev.
  # Upptime copies assets/ to the site root, so assets are served from status.patch-it.dev itself.
  # Always use FULL URLs for these, never "/file.svg": the build crawls root-relative links before
  # copying assets/, saves the 404 as a folder, and then fails with EISDIR.
  logoUrl: https://status.patch-it.dev/wordmark-on-dark.svg
  logoHref: https://status.patch-it.dev
  hideNavTitle: true
  favicon: https://status.patch-it.dev/icon-192.png
  faviconSvg: https://status.patch-it.dev/favicon.svg
  theme: dark
  # Our home view: overall banner, 90-day uptime bars per service, incidents (assets/status.js + status.css).
  scripts:
    - src: https://status.patch-it.dev/status.js
  links:
    - rel: stylesheet
      href: https://status.patch-it.dev/status.css
  introTitle: "patch-it system status"
  introMessage: Live status of the patch-it website and docs, checked every 5 minutes from GitHub, independently of our own hosting. Incidents are tracked as [GitHub issues](https://github.com/patch-it-dev/patch-it-uptime/issues).
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://patch-it.dev
    - title: Docs
      href: https://docs.patch-it.dev
    - title: GitHub
      href: https://github.com/patch-it-dev
  customHeadHtml: <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;600&display=swap"><meta name="theme-color" content="#0b0d11">
  # patch-it Dark theme tokens mapped onto Upptime's variables, plus a few layout touches.
  css: >-
    :root {
    --body-background-color: #0b0d11; --body-text-color: #e9ebee;
    --card-background-color: #12161c; --card-border-color: #2a313b;
    --nav-background-color: #0b0d11; --nav-border-bottom-color: #2a313b; --nav-current-border-bottom-color: #6f86ff;
    --up-border-left-color: #3fb950; --down-border-left-color: #f47067; --down-background-color: #2c1517; --degraded-border-left-color: #d4a72c;
    --tag-color: #0b0d11; --tag-up-background-color: #3fb950; --tag-down-background-color: #f47067; --tag-degraded-background-color: #d4a72c;
    --change-background-color: #d4a72c;
    --error-button-border-color: #6f86ff; --error-button-background-color: #6f86ff; --error-button-color: #0b0d11;
    --submit-button-border-color: #6f86ff; --submit-button-background-color: #6f86ff; --submit-button-color: #0b0d11;
    --graph-opacity: 0.9; --graph-filter: none; }
    body { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.01em; }
    h2 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #8a9cff; font-weight: 500; }
    code, .tag, dl dt { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    a { color: #8a9cff; } a:hover { color: #b3bfff; }
    nav a { color: #9ba3ad; font-weight: 400; } nav a[aria-current] { color: #e9ebee; }
    nav .logo img { height: 24px !important; width: auto; border-radius: 0 !important; margin-right: 0 !important; }
    article { border-radius: 14px !important; border-width: 1px !important; border-left-width: 4px !important; }
    .tag { border-radius: 999px !important; font-weight: 600; }
    a.error-button, .submit-button { border-radius: 999px !important; font-weight: 600; }
    :focus-visible { outline: 2px solid #6f86ff; outline-offset: 2px; }
